services:
  db:
    image: postgres:15-alpine
    container_name: crm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2255
      POSTGRES_DB: crm_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    ports:
      - '3001:3000'
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=2255
      - DB_NAME=crm_db
      - DB_SYNC=true
      - JWT_SECRET=uits-crm-jwt-secret-change-in-production-2026
      - CHOKIDAR_USEPOLLING=true
      - NODE_OPTIONS=--max-old-space-size=2048
    command: sh -c "npm run build && npm run start:prod"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - crm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    ports:
      - '5173:5173'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_CERT_API_URL=/sertifikat
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - certificate
    networks:
      - crm-network

  certificate:
    build:
      context: ./web-sertificate
      dockerfile: Dockerfile
    container_name: crm-certificate
    ports:
      - '8000:8000'
    volumes:
      - ./web-sertificate:/app
      - certificate_data:/app/media
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  postgres_data:
  certificate_data:
